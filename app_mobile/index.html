<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div id="tela-login" class="tela ativa">
  <div class="topo">
    <div class="icone-topo">🌸</div>
    <h1>Bom Dia,<br>Amigas!</h1>
    <p>Entre para continuar</p>
  </div>

  <div class="conteudo">
    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email"
               placeholder="seuemail@exemplo.com" />
        <span class="erro"></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" autocomplete="current-password" />
          <button type="button" id="ver-senha" aria-label="Mostrar senha">👁️</button>
        </div>
        <span class="erro"></span>
      </div>

      <button type="submit" class="btn-confirmar ativo">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
